annotation.processing.enabled=true
annotation.processing.enabled.in.editor=false
annotation.processing.processors.list=
annotation.processing.run.all.processors=true
annotation.processing.source.output=${build.generated.sources.dir}/ap-source-output
application.title=coe528bookapp2
application.vendor=tahak
build.classes.dir=${build.dir}/classes
build.classes.excludes=**/*.java,**/*.form
# This directory is removed when the project is cleaned:
build.dir=build
build.generated.dir=${build.dir}/generated
build.generated.sources.dir=${build.dir}/generated-sources
# Only compile against the classpath explicitly listed here:
build.sysclasspath=ignore
build.test.classes.dir=${build.dir}/test/classes
build.test.results.dir=${build.dir}/test/results
# Uncomment to specify the preferred debugger connection transport:
#debug.transport=dt_socket
debug.classpath=\
    ${run.classpath}
debug.modulepath=\
    ${run.modulepath}
debug.test.classpath=\
    ${run.test.classpath}
debug.test.modulepath=\
    ${run.test.modulepath}
# Files in build.classes.dir which should be excluded from distribution jar
dist.archive.excludes=
# This directory is removed when the project is cleaned:
dist.dir=dist
dist.jar=${dist.dir}/coe528bookapp2.jar
dist.javadoc.dir=${dist.dir}/javadoc
dist.jlink.dir=${dist.dir}/jlink
dist.jlink.output=${dist.jlink.dir}/coe528bookapp2
endorsed.classpath=
excludes=
file.reference.javafx.base.jar=lib/javafx-sdk-25.0.1/lib/javafx.base.jar
file.reference.javafx.controls.jar=lib/javafx-sdk-25.0.1/lib/javafx.controls.jar
file.reference.javafx.fxml.jar=lib/javafx-sdk-25.0.1/lib/javafx.fxml.jar
file.reference.javafx.graphics.jar=lib/javafx-sdk-25.0.1/lib/javafx.graphics.jar
file.reference.slf4j-api.jar=lib/slf4j-api-2.0.18.jar
file.reference.slf4j-nop.jar=lib/slf4j-nop-2.0.18.jar
file.reference.sqlite-jdbc.jar=lib/sqlite-jdbc-3.53.2.1.jar
includes=**
jar.compress=false
# JavaFX jars are listed here so javac and the IDE editor can resolve them.
# At run time they come from the module path instead (see run.jvmargs), so
# they are deliberately left out of run.classpath below.
javac.classpath=\
    ${file.reference.javafx.base.jar}:\
    ${file.reference.javafx.controls.jar}:\
    ${file.reference.javafx.fxml.jar}:\
    ${file.reference.javafx.graphics.jar}:\
    ${file.reference.sqlite-jdbc.jar}:\
    ${file.reference.slf4j-api.jar}:\
    ${file.reference.slf4j-nop.jar}
# Space-separated list of extra javac options
javac.compilerargs=
javac.deprecation=false
javac.external.vm=true
javac.modulepath=
javac.processormodulepath=
javac.processorpath=\
    ${javac.classpath}
javac.source=17
javac.target=17
javac.test.classpath=\
    ${javac.classpath}:\
    ${build.classes.dir}
javac.test.modulepath=\
    ${javac.modulepath}
javac.test.processorpath=\
    ${javac.test.classpath}
javadoc.additionalparam=
javadoc.author=false
javadoc.encoding=${source.encoding}
javadoc.html5=false
javadoc.noindex=false
javadoc.nonavbar=false
javadoc.notree=false
javadoc.private=false
javadoc.splitindex=true
javadoc.use=true
javadoc.version=false
javadoc.windowtitle=
# Directory holding the platform JavaFX jars and their native .dylib files.
javafx.sdk.lib=${basedir}/lib/javafx-sdk-25.0.1/lib
# The jlink additional root modules to resolve
jlink.additionalmodules=
# The jlink additional command line parameters
jlink.additionalparam=
jlink.launcher=true
jlink.launcher.name=coe528bookapp2
main.class=bookapp.JavaFXTest
meta.inf.dir=${src.dir}/META-INF
mkdist.disabled=true
platform.active=default_platform
run.classpath=\
    ${build.classes.dir}:\
    ${file.reference.sqlite-jdbc.jar}:\
    ${file.reference.slf4j-api.jar}:\
    ${file.reference.slf4j-nop.jar}
# Space-separated list of JVM arguments used when running the project.
# You may also define separate properties like run-sys-prop.name=value instead of -Dname=value.
# To set system properties for unit tests define test-sys-prop.name=value:
# --enable-native-access silences the JDK 25 warnings raised when a native
# library is loaded: ALL-UNNAMED covers sqlite-jdbc on the class path,
# javafx.graphics covers the JavaFX renderer. Without them the app still runs,
# but prints four warning lines per library on every launch.
run.jvmargs=--module-path "${javafx.sdk.lib}" --add-modules javafx.controls,javafx.fxml --enable-native-access=ALL-UNNAMED,javafx.graphics
run.modulepath=\
    ${javac.modulepath}
run.test.classpath=\
    ${javac.test.classpath}:\
    ${build.test.classes.dir}
run.test.modulepath=\
    ${javac.test.modulepath}
source.encoding=UTF-8
src.dir=src
test.src.dir=test
